name: Generate Japanese audio

on:
  workflow_dispatch:
  push:
    paths:
      - japanese/generate_audio.py
      - .github/workflows/generate-japanese-audio.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install edge-tts
      - run: python japanese/generate_audio.py
      - name: Save generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add japanese/audio
          if ! git diff --cached --quiet; then
            git commit -m "Generate Japanese male and female audio"
            git pull --rebase origin main
            git push
          fi
